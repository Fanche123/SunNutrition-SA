<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clave ARCA cifrada</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Clave ARCA</h1>
    <form id="secret-form" autocomplete="off">
      <label for="secret">Clave</label>
      <input id="secret" type="password" required autocomplete="new-password">
      <button type="submit">Guardar cifrada</button>
    </form>
    <button id="forget" type="button" class="secondary">Olvidar clave</button>
    <button id="copy-trace" type="button" class="secondary">Copiar diagnóstico seguro</button>
    <p id="status" role="status" aria-live="polite">Sin clave guardada</p>
    <p id="trace-status" role="status" aria-live="polite"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
